<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letter Ball Machine</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#f8fbff,#fff7ec);min-height:100vh;color:#24324a}
header{text-align:center;padding:20px 15px 8px} h1{margin:0;font-size:clamp(2rem,5vw,3.4rem)} .sub{margin:6px 0 0;font-size:1.1rem}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:15px}.controls button,.mode{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;box-shadow:0 3px 8px #0002;background:white}.controls button:hover{transform:translateY(-1px)} .draw{background:#ffd45c!important;font-size:1.2rem!important}.reset{background:#e8eef8!important}.mode.active{outline:4px solid #8bb8ff;background:#eaf3ff}
.machine{width:min(920px,94vw);margin:auto;background:#ffffffcc;border:5px solid #cad5e8;border-radius:30px;padding:20px;box-shadow:0 8px 25px #0002}
.balls{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:9px;min-height:155px;align-items:center}
.ball{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;font-weight:900;font-size:1.65rem;color:#24324a;background:radial-gradient(circle at 30% 25%,#fff 0 9%,#fff9 10% 18%,#bcd8ff 19% 60%,#82aee9 61%);box-shadow:inset -5px -7px 10px #426fa633,0 4px 7px #0002}
.ball.lower{background:radial-gradient(circle at 30% 25%,#fff 0 9%,#fff9 10% 18%,#ffd2a5 19% 60%,#f2a55e 61%)}
.result{text-align:center;padding:18px;min-height:235px;display:flex;flex-direction:column;justify-content:center;align-items:center}.resultBall{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7rem;font-weight:900;background:radial-gradient(circle at 30% 24%,#fff 0 8%,#fff9 9% 17%,#bcd8ff 18% 61%,#75a5e8 62%);box-shadow:inset -14px -18px 22px #426fa633,0 12px 25px #0002;animation:pop .45s ease}.resultBall.lower{background:radial-gradient(circle at 30% 24%,#fff 0 8%,#fff9 9% 17%,#ffd2a5 18% 61%,#ee9c50 62%)}.resultBall.shake{animation:shake .8s ease}@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-15px) rotate(-8deg)}40%{transform:translateX(15px) rotate(8deg)}60%{transform:translateX(-10px) rotate(-5deg)}80%{transform:translateX(10px) rotate(5deg)}}
.prompt{font-size:1.2rem;font-weight:bold;margin:12px}.history{margin-top:15px}.history h2{text-align:center;font-size:1.25rem}.drawn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:45px}.chip{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;background:#eef4ff;border:2px solid #9bb9e9}.chip.lower{background:#fff0df;border-color:#eeb475}
.notice{text-align:center;font-size:.95rem;color:#5d6b80;margin:8px}
@media(max-width:600px){.ball{width:50px;height:50px;font-size:1.4rem}.balls{grid-template-columns:repeat(9,1fr)}.resultBall{width:145px;height:145px;font-size:5.7rem}}
</style>
</head>
<body>
<header><h1>🎱 Letter Ball Machine</h1><div class="sub">Pick a mode, then pull a letter ball!</div></header>
<div class="controls">
<button class="mode active" id="keep">Keep Letters on Screen</button>
<button class="mode" id="hide">Hide Drawn Letters</button>
<button class="draw" id="draw">🎱 DRAW A LETTER!</button>
<button class="reset" id="reset">↻ Reset</button>
</div>
<div class="machine">
<div class="balls" id="balls"></div>
<div class="result">
<div class="resultBall" id="result">?</div>
<div class="prompt" id="prompt">Ready to draw!</div>
</div>
<div class="history" id="history"><h2>Letters Drawn</h2><div class="drawn" id="drawn"></div></div>
<div class="notice">Blue balls = uppercase • Orange balls = lowercase</div>
</div>
<script>
const upper=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"], lower=[..."abcdefghijklmnopqrstuvwxyz"];
let pool=[], drawn=[], keep=true;
const balls=document.getElementById("balls"), result=document.getElementById("result"), prompt=document.getElementById("prompt"), drawnEl=document.getElementById("drawn"), history=document.getElementById("history");
function buildPool(){pool=[];upper.forEach((x,i)=>pool.push({letter:x,case:"upper",key:x}));lower.forEach((x,i)=>pool.push({letter:x,case:"lower",key:x}));}
function renderPool(){
 balls.innerHTML="";
 if(!keep){balls.innerHTML='<div style="grid-column:1/-1;text-align:center;font-weight:bold;color:#68778d;padding:35px">Drawn balls disappear from the machine.</div>';return}
 pool.forEach(o=>{const b=document.createElement("div");b.className="ball "+(o.case==="lower"?"lower":"");b.textContent=o.letter;balls.appendChild(b)})
}
function renderHistory(){drawnEl.innerHTML="";drawn.forEach(o=>{const c=document.createElement("div");c.className="chip "+(o.case==="lower"?"lower":"");c.textContent=o.letter;drawnEl.appendChild(c)})}
function drawLetter(){
 if(!pool.length){prompt.textContent="🎉 All 52 letter balls have been drawn!";return}
 const btn=document.getElementById("draw");btn.disabled=true;
 result.className="resultBall shake";result.textContent="";prompt.textContent="Mixing the balls...";
 setTimeout(()=>{
  const i=Math.floor(Math.random()*pool.length),o=pool.splice(i,1)[0];drawn.push(o);
  result.className="resultBall "+(o.case==="lower"?"lower":"");result.textContent=o.letter;
  prompt.textContent=o.case==="upper"?"Uppercase letter!":"Lowercase letter!";
  renderPool();renderHistory();btn.disabled=false;
 },800);
}
document.getElementById("keep").onclick=()=>{keep=true;document.getElementById("keep").classList.add("active");document.getElementById("hide").classList.remove("active");renderPool()};
document.getElementById("hide").onclick=()=>{keep=false;document.getElementById("hide").classList.add("active");document.getElementById("keep").classList.remove("active");renderPool()};
document.getElementById("draw").onclick=drawLetter;
document.getElementById("reset").onclick=()=>{buildPool();drawn=[];result.className="resultBall";result.textContent="?";prompt.textContent="Ready to draw!";renderPool();renderHistory()};
buildPool();renderPool();
</script>
</body>
</html>
